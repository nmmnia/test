<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Touchpad Event Analyzer (Chromium)</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; margin: 0; overflow: hidden; }
        #container { display: flex; height: 100vh; }
        #visualizer { flex: 1; border-right: 1px solid #333; position: relative; overflow-y: scroll; }
        #content { height: 10000px; background: linear-gradient(to bottom, #1a1a1a, #2a2a2a); position: relative; }
        #log-panel { width: 450px; display: flex; flex-direction: column; background: #000; }
        .header { padding: 10px; background: #333; color: white; font-weight: bold; }
        #stats { padding: 10px; border-bottom: 1px solid #444; font-size: 12px; color: #00d4ff; }
        #event-log { flex: 1; overflow-y: auto; padding: 5px; font-size: 11px; }
        .event-item { margin-bottom: 2px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .momentum { color: #ff8800; } /* 관성 이벤트 강조 */
        .precise { color: #00ff00; }
        .marker { position: absolute; width: 100%; border-top: 1px solid #444; color: #444; padding-left: 10px; }
    </style>
</head>
<body>

<div id="container">
    <div id="visualizer">
        <div id="content">
            <script>
                for(let i=0; i<10000; i+=500) {
                    document.write(`<div class="marker" style="top:${i}px">${i}px</div>`);
                }
            </script>
        </div>
    </div>

    <div id="log-panel">
        <div class="header">Touchpad / Wheel Debugger</div>
        <div id="stats">
            Waiting for input... (Two-finger scroll or Flick)
        </div>
        <div id="event-log"></div>
    </div>
</div>

<script>
    const logDiv = document.getElementById('event-log');
    const statsDiv = document.getElementById('stats');
    let lastTime = 0;
    let eventCount = 0;

    window.addEventListener('wheel', (e) => {
        // e.preventDefault(); // 실제 스크롤 방지 여부 테스트 시 주석 해제
        
        const now = performance.now();
        const interval = lastTime ? (now - lastTime).toFixed(2) : 0;
        lastTime = now;
        eventCount++;

        // 1. 데이터 분석
        const isPrecise = (e.deltaY % 1 !== 0); // 소수점이 있으면 고정밀
        const direction = e.deltaY > 0 ? "Down" : "Up";
        
        // 2. 통계 업데이트
        statsDiv.innerHTML = `
            <b>Current Event:</b> #${eventCount}<br>
            <b>Interval:</b> ${interval} ms<br>
            <b>DeltaY:</b> ${e.deltaY.toFixed(4)} (Mode: ${e.deltaMode})<br>
            <b>Precise Scrolling:</b> ${isPrecise ? "YES (Sub-pixel)" : "NO (Discrete)"}
        `;

        // 3. 로그 기록
        const item = document.createElement('div');
        item.className = 'event-item';
        if (isPrecise) item.classList.add('precise');
        
        // Flick 시 손가락을 뗀 후에도 이벤트가 오는지 확인하기 위해 
        // 100ms 이상 간격이 벌어지면 강조 (Inertia 추정)
        if (interval > 50 && eventCount > 1) {
            item.classList.add('momentum');
            item.innerHTML += `<b>[Momentum/Inertia?]</b> `;
        }

        item.innerHTML += `TS: ${e.timeStamp.toFixed(0)} | ΔY: ${e.deltaY.toFixed(3)} | Interval: ${interval}ms`;
        logDiv.prepend(item);

        if (logDiv.childNodes.length > 100) logDiv.lastChild.remove();
    }, { passive: false });

    // 터치패드가 Touch 이벤트를 직접 발생시키는지 확인 (일반적으로는 안 함)
    window.addEventListener('touchstart', () => console.log('Touch Start detected'));
</script>
</body>
</html>
