<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Touchpad Data Inspector</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0; --accent: #00e5ff; }
        body { background: var(--bg); color: var(--text); font-family: 'Consolas', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { padding: 15px; background: var(--panel); border-bottom: 2px solid var(--accent); }
        #main { display: flex; flex: 1; overflow: hidden; }
        #canvas { flex: 1; display: flex; align-items: center; justify-content: center; border: 2px dashed #444; margin: 20px; position: relative; }
        #log-container { width: 500px; background: #000; overflow-y: auto; padding: 10px; font-size: 12px; border-left: 1px solid #333; }
        .event-card { border-left: 4px solid var(--accent); background: #222; margin-bottom: 8px; padding: 8px; }
        .event-name { font-weight: bold; color: var(--accent); margin-bottom: 5px; display: block; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 2px 0; border-bottom: 1px solid #333; }
        .val { color: #fff; text-align: right; }
        .momentum { border-left-color: #ff9100; background: #2d1f10; }
        .high-precision { color: #ffeb3b; font-size: 10px; }
    </style>
</head>
<body>

<div id="header">
    <strong>Touchpad Event Inspector</strong> | <small>Chromium Rendering Dev Tools</small>
</div>

<div id="main">
    <div id="canvas">
        <p>이 영역에서 Swipe, Flick, Hold를 테스트하세요.</p>
    </div>

    <div id="log-container" id="log">
        </div>
</div>

<script>
    const logContainer = document.getElementById('log-container');
    let lastTs = 0;

    function logEvent(name, data, isMomentum = false) {
        const now = performance.now();
        const interval = lastTs ? (now - lastTs).toFixed(2) : 0;
        lastTs = now;

        const card = document.createElement('div');
        card.className = `event-card ${isMomentum ? 'momentum' : ''}`;
        
        let rows = '';
        for (const [key, val] of Object.entries(data)) {
            rows += `<tr><td>${key}</td><td class="val">${val}</td></tr>`;
        }

        const preciseFlag = data.deltaY && data.deltaY % 1 !== 0 ? '<span class="high-precision"> [HIGH-PRECISION]</span>' : '';

        card.innerHTML = `
            <span class="event-name">${name} ${preciseFlag}</span>
            <table>${rows}<tr><td>interval</td><td class="val">${interval}ms</td></tr></table>
        `;

        logContainer.prepend(card);
        if (logContainer.childNodes.length > 50) logContainer.lastChild.remove();
    }

    // 1. Wheel Event (Swipe, Flick의 핵심)
    window.addEventListener('wheel', (e) => {
        const isMomentum = (e.deltaY !== 0 && Math.abs(e.deltaY) < 1) || (performance.now() - lastTs > 50);
        logEvent('WHEEL', {
            deltaX: e.deltaX.toFixed(4),
            deltaY: e.deltaY.toFixed(4),
            deltaMode: e.deltaMode, // 0: Pixel, 1: Line, 2: Page
            clientX: e.clientX,
            clientY: e.clientY
        }, isMomentum);
    }, { passive: false });

    // 2. Pointer Event (터치패드 클릭이나 한 손가락 이동 확인)
    window.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch' || e.pointerType === 'pen' || e.buttons > 0) {
            logEvent('POINTER_MOVE', {
                type: e.pointerType,
                x: e.clientX.toFixed(1),
                y: e.clientY.toFixed(1),
                pressure: e.pressure.toFixed(2)
            });
        }
    });

    // 3. Touch Event (브라우저가 Raw Touch를 지원할 경우)
    window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        logEvent('TOUCH_MOVE', {
            id: touch.identifier,
            pageX: touch.pageX.toFixed(1),
            pageY: touch.pageY.toFixed(1)
        });
    }, { passive: false });
</script>
</body>
</html>
